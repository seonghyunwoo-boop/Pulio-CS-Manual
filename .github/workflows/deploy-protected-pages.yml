name: Deploy Protected CS Manual

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm install --no-save javascript-obfuscator html-minifier-terser

      - name: Build protected manual
        run: node scripts/protect.cjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload protected files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./protected

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
